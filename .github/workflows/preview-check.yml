name: Winter preview checks

on:
  push:
    branches: ['preview/**']

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate source, guestbook and Worker bundle without uploading
        run: |
          npm ci --no-audit --no-fund
          npm run deploy:check
      - name: Set up browser and Chinese fonts
        run: |
          command -v npx
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify the private candidate in a cloud browser
        run: |
          npm run preview > "$RUNNER_TEMP/winter-preview.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; tail -n 35 "$RUNNER_TEMP/winter-preview.log"' EXIT
          timeout 60 bash -c 'until curl -fsS -o /dev/null http://127.0.0.1:4192/api/guestbook; do sleep 2; done'
          node tools/check-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: winter-review
          path: output/playwright/
          if-no-files-found: error
          retention-days: 7
